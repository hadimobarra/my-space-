name: Deploy to hadimobarra.github.io

# Verifies the site, then publishes the static export to the gh-pages branch of
# hadimobarra/hadimobarra.github.io, which serves https://hadimobarra.github.io.
#
# One-time setup: create a fine-grained token with "Contents: Read and write"
# on hadimobarra/hadimobarra.github.io and save it in this repo as the
# DEPLOY_TOKEN secret (Settings → Secrets and variables → Actions).

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild, so pull requests and star counts stay current.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets:
      WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Publish to hadimobarra.github.io
        if: env.HAS_DEPLOY_TOKEN == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: hadimobarra/hadimobarra.github.io
          publish_branch: gh-pages
          publish_dir: ./out
          commit_message: "Deploy ${{ github.sha }}"
