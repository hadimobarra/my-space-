name: CI

# Lint, types, build, JavaScript budget, Playwright (smoke, features, SEO, accessibility)
# and Lighthouse. Runs on pull requests; deploy.yml calls it before publishing.

on:
  pull_request:
  workflow_call:
    secrets:
      WEB3FORMS_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh open-source activity
        run: npm run data:github
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: npm run lint

      - run: npm run build
        env:
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          NEXT_PUBLIC_BOOKING_URL: ${{ vars.BOOKING_URL }}
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}

      - run: npm run typecheck

      - run: npm run budget

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            playwright-report
            .lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - run: touch out/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true
          retention-days: 7
